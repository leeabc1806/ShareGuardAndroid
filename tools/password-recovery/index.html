<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>비밀번호 재설정 · ShareGuard</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/recovery.js" defer></script>
</head>
<body>
  <main class="card">
    <p class="brand">ShareGuard</p>
    <h1>비밀번호 재설정</h1>
    <p class="intro">새 비밀번호를 설정한 뒤 휴대폰 앱에서 로그인하세요.</p>
    <p id="status" role="status" aria-live="polite">메일 링크를 확인하고 있습니다.</p>
    <p id="account" class="account" hidden></p>
    <form id="recovery-form" hidden>
      <label for="password">새 비밀번호</label>
      <input id="password" name="password" type="password" autocomplete="new-password"
        minlength="8" required aria-describedby="password-help">
      <p id="password-help" class="hint">8자 이상으로 입력하세요.</p>
      <label for="confirmation">새 비밀번호 확인</label>
      <input id="confirmation" name="confirmation" type="password" autocomplete="new-password"
        minlength="8" required>
      <button id="submit" type="submit">비밀번호 변경</button>
    </form>
    <section id="instructions" hidden>
      <h2>재설정 메일에서 시작해주세요</h2>
      <ol>
        <li>Supabase 회원 상세 화면에서 <strong>Send password recovery</strong>를 누르세요.</li>
        <li>가장 최근에 받은 메일의 재설정 링크를 <strong>이 PC에서</strong> 여세요.</li>
        <li>이 화면에서 새 비밀번호를 입력하세요.</li>
      </ol>
      <p class="hint">이미 사용했거나 만료된 링크라면 새 메일이 필요합니다.</p>
    </section>
    <p class="footer">PC에서 비밀번호를 바꾸면 휴대폰 앱에도 바로 적용됩니다.</p>
    <noscript>비밀번호 재설정을 위해 브라우저의 JavaScript를 켜주세요.</noscript>
  </main>
</body>
</html>
