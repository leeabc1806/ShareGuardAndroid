server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: shareguard-backend
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/shareguard?sslmode=disable}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 900000
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SUPABASE_JWKS_URI:http://localhost:9999/auth/v1/.well-known/jwks.json}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

shareguard:
  portone:
    # PortOne V2 API Secret. Never put the real value in this file or Git.
    base-url: ${PORTONE_API_BASE_URL:https://api.portone.io}
    api-secret: ${PORTONE_API_SECRET:}
    store-id: ${PORTONE_STORE_ID:}
  mfa:
    # Matches the existing ShareGuard trust-score rule for verified identity.
    trust-bonus: ${MFA_TRUST_BONUS:150}
  toss:
    base-url: ${TOSS_API_BASE_URL:https://api.tosspayments.com}
    secret-key: ${TOSS_SECRET_KEY:}
  qr:
    ttl-seconds: ${QR_TOKEN_TTL_SECONDS:300}
  webhook:
    path-token: ${TOSS_WEBHOOK_PATH_TOKEN:change-me}
