services:
  - type: web
    name: shareguard-backend
    runtime: docker
    plan: free
    region: singapore
    branch: integration/shareguard-all-2026-09-23
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: off
    healthCheckPath: /actuator/health
    envVars:
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=65.0 -XX:ActiveProcessorCount=2
      - key: DB_POOL_MAX_SIZE
        value: "3"
      - key: DB_POOL_MIN_IDLE
        value: "0"
      - key: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWS_ALGORITHMS
        value: ES256
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_DB_USER
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: SUPABASE_JWKS_URI
        sync: false
      - key: PORTONE_API_SECRET
        sync: false
      - key: PORTONE_STORE_ID
        sync: false
      - key: TOSS_WEBHOOK_PATH_TOKEN
        generateValue: true
